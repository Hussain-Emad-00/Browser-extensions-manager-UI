<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Frontend Mentor Challenge" />
		<link
			rel="shortcut icon"
			href="assets/images/favicon-32x32.png"
			type="image/x-icon"
		/>
		<link rel="stylesheet" href="css/main.css" />
		<title>Browser extension manager UI</title>
	</head>
	<body class="light">
		<header>
			<img src="assets/images/logo.svg" alt="Logo" class="header__logo" />
			<button type="button" class="header__theme-btn" id="theme-toggle">
				<img
					src="assets/images/icon-moon.svg"
					alt="Theme icon"
					id="toggle-icon"
					class="header__theme-icon"
				/>
			</button>
		</header>

		<main>
			<section class="extensions__header">
				<h1 class="extensions__header-title">Extensions List</h1>
				<section class="extensions__header-filter">
					<button
						type="button"
						class="extensions__header-filter-btn active"
						data-state="all"
						name="show-data-btn"
					>
						All
					</button>
					<button
						type="button"
						class="extensions__header-filter-btn"
						data-state="active"
						name="show-data-btn"
					>
						Active
					</button>
					<button
						type="button"
						class="extensions__header-filter-btn"
						data-state="inactive"
						name="show-data-btn"
					>
						Inactive
					</button>
				</section>
			</section>
			<section class="extensions__list" id="extensions-list"></section>

			<script type="module" type="text/javascript" src="js/main.js"></script>
		</main>
	</body>
</html>
